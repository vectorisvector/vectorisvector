name: Update profile

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Generate metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.svg
          output_action: none
          base: header, activity, community, repositories
          config_timezone: Asia/Shanghai
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugins_errors_fatal: yes
          retries: 2
          retries_delay: 30

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark

      - name: Validate generated images
        run: |
          sudo cp /metrics_renders/metrics.svg profile/metrics.svg
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for name in ("metrics.svg", "snake.svg", "snake-dark.svg"):
              path = Path("profile") / name
              root = ET.parse(path).getroot()
              assert root.tag == "{http://www.w3.org/2000/svg}svg", path
              content = path.read_text().lower()
              for error in ("something went wrong", "rate limit exceeded", "bad credentials"):
                  assert error not in content, f"{path}: {error}"
          PY

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/metrics.svg profile/snake.svg profile/snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profile images"
            git push
          fi
